---
version: "3"

# silent: true

includes:
  c: https://raw.githubusercontent.com/standardloop/taskfiles/refs/heads/main/c.yml # can pin in future
  # c: ../taskfiles/c.yml

vars:
  SOURCE_FILES:
    - item.c
    - list.c
    - hashmap.c
    - operations.c
    - stack.c
    - queue.c
    - linkedlist.c
  TEST_SOURCE_FILES:
    - item.test.c
    - list.test.c
    - hashmap.test.c
    - stack.test.c
    - queue.test.c
    - linkedlist.test.c
  DYLIB_NAME: libstandardloop-collections.dylib
  DYLIB_HEADER: collections.h
  DYN_LIBS_USED: "-lstandardloop-util"

tasks:
  default:
    cmds:
      - task: test:build

  # GH_RELEASE_VERSION is set by CI
  release:
    deps:
      - dependencies
    cmds:
      - task: c:release

  dependencies:
    deps:
      - c:dependencies:util

  test:
    deps:
      - test:run

  test:build-sanitize:
    deps:
      - dependencies
    cmds:
      - task: c:test:build-sanitize
  test:build:
    deps:
      - dependencies
    cmds:
      - task: c:test:build

  test:run:
    deps:
      - test:build
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}

  clean:
    deps:
      - c:test:clean

  fmt:
    deps:
      - c:fmt

  docs:
    deps:
      - c:docs:moxygen

  test:leaks:
    desc: "Run macOS leaks on the test program."
    deps:
      - test:build
    cmds:
      - cp /usr/local/lib/standardloop/libstandardloop-util.dylib ./
      - leaks --atExit -- ./{{.TEST_EXECUTABLE_NAME}}
      - rm libstandardloop-util.dylib
