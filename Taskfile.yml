---
version: "3"

# silent: true

includes:
  c: https://raw.githubusercontent.com/standardloop/taskfiles/refs/heads/main/c.yml # can pin in future
  # c: ../taskfiles/c.yml

vars:
  SOURCE_FILES:
    - item.c
    - list.c
    - hashmap.c
  TEST_SOURCE_FILES: []
  DYLIB_NAME: libstandardloop-collections.dylib
  DYLIB_HEADER: collections.h
  DYN_LIBS_USED: "-lstandardloop-util"

tasks:
  default:
    cmds:
      - task: test:build

  # GH_RELEASE_VERSION is set by CI
  release:
    deps:
      - c:release

  dependencies:
    deps:
      - c:dependencies:util

  test:
    deps:
      - test:run

  test:build-sanitize:
    deps:
      - dependencies
    cmds:
      - task: c:test:build-sanitize
  test:build:
    deps:
      - dependencies
    cmds:
      - task: c:test:build

  test:run:
    deps:
      - test:build
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}

  clean:
    deps:
      - c:test:clean

  fmt:
    deps:
      - c:fmt

  docs:
    deps:
      - c:docs:moxygen
