---
version: "3"

# silent: true

includes:
  c: '{{ if eq .CI "true" }}https://raw.githubusercontent.com/standardloop/taskfiles/refs/heads/main/c.yml{{ else }}../taskfiles/c.yml{{ end }}'

vars:
  SOURCE_FILES:
    - item.c
    - list.c
    - hashmap.c
    - operations.c
    - stack.c
    - queue.c
    - linkedlist.c
    - complexhashmap.c
  TEST_SOURCE_FILES:
    - item.test.c
    - list.test.c
    - hashmap.test.c
    - stack.test.c
    - queue.test.c
    - linkedlist.test.c
    - complexhashmap.test.c
  DYLIB_NAME: libstandardloop-collections.dylib
  DYLIB_HEADER: collections.h
  DYN_LIBS_USED: "-lstandardloop-util"

tasks:
  default:
    cmds:
      - task: test:build

  # GH_RELEASE_VERSION is set by CI
  release:
    deps:
      - dependencies
    cmds:
      - task: c:release

  dependencies:
    deps:
      - c:dependencies:util:latest

  test:
    deps:
      - test:run

  sanitize:
    deps:
      - test:run-sanitize

  test:build-sanitize:
    deps:
      - dependencies
      - c:dependencies:testing
    cmds:
      - task: c:test:build-sanitize

  test:build:
    deps:
      - dependencies
      - c:dependencies:testing
    cmds:
      - task: c:test:build

  test:run:
    deps:
      - test:build
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}

  test:run-sanitize:
    deps:
      - test:build-sanitize
    cmds:
      - ./{{.TEST_EXECUTABLE_NAME}}-sanitize

  clean:
    deps:
      - c:test:clean

  fmt:
    deps:
      - c:fmt

  docs:
    deps:
      - c:docs

  test:leaks:
    aliases:
      - leaks
    desc: "Run macOS leaks on the test program."
    deps:
      - test:build
    cmds:
      - cp /usr/local/lib/standardloop/libstandardloop-util.dylib ./
      - leaks --atExit -- ./{{.TEST_EXECUTABLE_NAME}}
      - rm libstandardloop-util.dylib
